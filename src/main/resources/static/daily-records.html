<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Records - Inventory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Multi-Store</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="daily-records.html" class="active">Daily Records</a></li>
            <li><a href="daily-entry.html">Daily Entry</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="stores.html">Stores</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>
    </div>
    <div class="main-content">
        <h1>Daily Records History</h1>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Store</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.querySelector('#recordsTable tbody');
            try {
                const res = await fetch('/api/daily-records');
                const records = await res.json();
                records.sort((a,b) => new Date(b.recordDate) - new Date(a.recordDate));
                records.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${r.id}</td>
                        <td>${r.recordDate}</td>
                        <td>${r.store.name}</td>
                        <td>Locked</td>
                        <td>
                            <button class="btn-primary" onclick="window.location.href='daily-entry.html?editId=${r.id}'">Edit</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                console.error("Failed to load records", e);
            }
        });
    </script>
</body>
</html>
