<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Entry - Inventory</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .split-container { display: flex; gap: 20px; }
        .image-panel { width: 300px; flex-shrink: 0; background: #eee; padding: 10px; border-radius: 5px; }
        .data-panel { flex-grow: 1; }
        #uploadedImage { max-width: 100%; display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Multi-Store</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="daily-records.html">Daily Records</a></li>
            <li><a href="daily-entry.html" class="active">Daily Entry</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="stores.html">Stores</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>
    </div>
    <div class="main-content">
        <h1 id="pageTitle">New Daily Record</h1>
        <div class="split-container">
            <div class="image-panel">
                <h3>Source Image</h3>
                <input type="file" id="imageUpload" accept="image/png, image/jpeg">
                <div style="margin-top: 15px;">
                    <img id="uploadedImage" src="" alt="Preview">
                    <p id="noImageText">No image uploaded.</p>
                </div>
            </div>
            
            <div class="data-panel">
                <div class="entry-header">
                    <div>
                        <label>Store:</label>
                        <select id="storeSelect"></select>
                    </div>
                    <div>
                        <label>Date:</label>
                        <input type="date" id="recordDate">
                    </div>
                </div>

                <div class="entry-header" style="background:#f9f9f9; border:1px solid #ddd; padding: 10px;">
                    <div>
                        <label>Product:</label>
                        <select id="productSelect">
                            <option value="">-- Choose Product --</option>
                        </select>
                    </div>
                    <div>
                        <label>Size:</label>
                        <select id="variantSelect">
                            <option value="">-- Choose Size --</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn-primary" onclick="addRowFromSelect()" style="margin-top:20px;">Add</button>
                    </div>
                </div>

                <table id="entryTable">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Size</th>
                            <th>Opening</th>
                            <th>Received</th>
                            <th>Total</th>
                            <th>Sold</th>
                            <th>Closing</th>
                            <th>Price</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

                <div style="margin-top: 20px;">
                    <button class="btn-primary" id="saveBtn" onclick="saveRecord()">Save Daily Record</button>
                    <p id="saveMessage"></p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script src="js/daily-entry.js"></script>
</body>
</html>
