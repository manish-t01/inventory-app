<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products - Inventory</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); }
        .modal-content { background-color: var(--bg-secondary); margin: 5% auto; padding: 20px; border: 1px solid var(--border-color); width: 80%; max-width: 600px; border-radius: 5px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        .badge-active { background-color: #4CAF50; color: var(--btn-text, white); padding: 4px 8px; border-radius: 4px; font-size: 0.9em; }
        .badge-inactive { background-color: #f44336; color: var(--btn-text, white); padding: 4px 8px; border-radius: 4px; font-size: 0.9em; }
        #messageBox, #variantMessageBox { margin-top: 10px; font-weight: bold; }
        .error-msg { color: red; }
        .success-msg { color: green; }
        .search-box { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background-color: var(--table-header-bg); }
    </style>
    <script src="js/theme.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>Multi-Store</h2>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="daily-records.html">Daily Records</a></li>
            <li><a href="daily-entry.html">Daily Entry</a></li>
            <li><a href="products.html" class="active">Products</a></li>
            <li><a href="stores.html">Stores</a></li>
            <li><a href="reports.html">Reports</a></li>
        </ul>

        <div class="theme-toggle-container">
            <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="window.toggleTheme()">
                🌙 Dark Mode
            </button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="flex-between">
            <h1>Products</h1>
            <button class="btn-primary" onclick="openProductModal()">+ Add Product</button>
        </div>
        
        <div>
            <input type="text" id="productSearch" class="search-box" placeholder="Search products..." onkeyup="filterProducts()">
        </div>
        
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="5">Loading products...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProductModal()">&times;</span>
            <h2 id="productModalTitle">Add Product</h2>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="prodName" placeholder="e.g. Coca Cola">
            </div>
            <div class="form-group">
                <label>Category / Description</label>
                <input type="text" id="prodCategory" placeholder="e.g. Cold Drinks">
            </div>
            <div class="form-group" id="prodStatusGroup" style="display:none;">
                <label>Status</label>
                <select id="prodActive">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>
            <button class="btn-primary" id="saveProdBtn" onclick="saveProduct()">Save Product</button>
            <button onclick="closeProductModal()">Cancel</button>
            <div id="messageBox"></div>
        </div>
    </div>

    <!-- Variants Modal -->
    <div id="variantModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeVariantModal()">&times;</span>
            <h2>Manage Variants: <span id="variantModalProductName"></span></h2>
            
            <div style="background: var(--bg-secondary); padding: 15px; margin-bottom: 20px; border: 1px solid var(--border-color);">
                <h3 id="variantFormTitle">Add Variant</h3>
                <div style="display:flex; gap:10px; align-items:flex-end;">
                    <div class="form-group" style="margin-bottom:0; flex-grow:1;">
                        <label>Size</label>
                        <input type="text" id="varSize" placeholder="e.g. 250 ml">
                    </div>
                    <div class="form-group" style="margin-bottom:0; flex-grow:1;">
                        <label>Selling Price (₹)</label>
                        <input type="number" id="varPrice" placeholder="e.g. 20" min="0">
                    </div>
                    <div class="form-group" id="varStatusGroup" style="margin-bottom:0; display:none; flex-grow:1;">
                        <label>Status</label>
                        <select id="varActive">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn-primary" id="saveVarBtn" onclick="saveVariant()">Save Variant</button>
                        <button id="cancelVarEditBtn" onclick="resetVariantForm()" style="display:none;">Cancel</button>
                    </div>
                </div>
                <div id="variantMessageBox"></div>
            </div>

            <table id="variantsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Size</th>
                        <th>Selling Price</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
